<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body class="pagina-acesso">
    <a class="voltar" href="{{ url_for('auth.login') }}" aria-label="Voltar ao login">
        <span class="seta" aria-hidden="true">←</span>
        <span>Voltar</span>
        <span class="divisor" aria-hidden="true"></span>
        <span class="marca">Sabor &amp; Click</span>
    </a>

    <main class="login">
        <section class="cartao cartao-cadastro" aria-labelledby="titulo">
            <header class="cabecalho">
                <p class="identidade">SABOR &amp; CLICK</p>
                <h1 id="titulo">Crie sua conta</h1>
                <p class="descricao">Cadastre-se para planejar seu evento com praticidade.</p>
            </header>

            <form class="formulario" action="{{ url_for('auth.cadastro') }}" method="post">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name">
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" inputmode="numeric">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" autocomplete="tel">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password">
                </div>
                <a class="cadastro" href="{{ url_for('auth.login') }}">Já tem uma conta? Entre</a>
                <button class="entrar" type="submit">Cadastrar</button>
            </form>
        </section>
    </main>
</body>
</html>
