<aside class="menu-admin">
    <p class="menu-admin-titulo">Administração</p>
    <nav aria-label="Menu administrativo">
        <a href="/admin"{% if pagina_admin == 'geral' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Visão geral</span></a>
        <a href="/pedidos"{% if pagina_admin == 'pedidos' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 15h6"/></svg><span>Pedidos</span></a>
        <a href="/painel/funcionarios"{% if pagina_admin == 'funcionarios' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-5.65"/></svg><span>Funcionários</span></a>
        <a href="/estoque"{% if pagina_admin == 'estoque' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></svg><span>Estoque</span></a>
        {% for chave, titulo, caminho in [('cardapio','Cardápio','/painel/cardapio'),('bebidas','Bebidas','/painel/bebidas')] %}
        <a href="{{ caminho }}"{% if pagina_admin == chave %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">{% if chave == 'cardapio' %}<path d="M4 3h6a3 3 0 0 1 2 3v15a4 4 0 0 0-4-2H4V3Zm16 0h-6a3 3 0 0 0-2 3v15a4 4 0 0 1 4-2h4V3Z"/>{% else %}<path d="M7 3h10l-1 8a4 4 0 0 1-8 0L7 3ZM12 15v6M8 21h8M7.5 7h9"/>{% endif %}</svg><span>{{ titulo }}</span></a>
        {% endfor %}
    </nav>
    <div class="menu-admin-rodape">
        {% if request.blueprint == 'admin' %}
        <form action="{{ url_for('auth.logout') }}" method="post"><button class="menu-admin-sair" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h13"/></svg><span>Sair</span></button></form>
        {% else %}
        <a class="menu-admin-sair" href="{{ url_for('auth.login') }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h13"/></svg><span>Sair</span></a>
        {% endif %}
    </div>
</aside>
