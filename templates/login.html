<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="pagina-acesso">
    <a class="voltar" aria-disabled="true" title="Página inicial ainda indisponível">
        <span class="seta" aria-hidden="true">←</span>
        <span>Voltar</span>
        <span class="divisor" aria-hidden="true"></span>
        <span class="marca">Sabor &amp; Click</span>
    </a>

    <main class="login">
        <section class="cartao" aria-labelledby="titulo">
            <header class="cabecalho">
                <p class="identidade">SABOR &amp; CLICK</p>

                <h1 id="titulo">Entrar na sua conta</h1>

                <p class="descricao">
                    Acesse para organizar seu evento com sabor e praticidade.
                </p>
            </header>

            <fieldset class="opcoes-login">
                <legend>Como deseja entrar?</legend>

                <div class="alternador">
                    <input type="radio" id="opcao-email" name="tipo_login" form="form-login" value="email" checked>
                    <label for="opcao-email">E-mail</label>

                    <input type="radio" id="opcao-cpf" name="tipo_login" form="form-login" value="cpf">
                    <label for="opcao-cpf">CPF</label>
                </div>
            </fieldset>

            <form id="form-login" class="formulario" action="{{ url_for('auth.login') }}" method="post">
                <div class="campo" id="campo-email">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="credencial" placeholder="seuemail@exemplo.com"
                        autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>

                <div class="campo" id="campo-cpf" hidden>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="credencial" placeholder="Digite os 11 números do CPF"
                        inputmode="numeric" autocomplete="username" maxlength="11" pattern="[0-9]{11}"
                        title="Informe os 11 números do CPF, sem pontos ou traço." disabled>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                        autocomplete="current-password" required>
                </div>
                <a class="cadastro" href="{{ url_for('auth.cadastro') }}">
                    Ainda não tem conta? Cadastre-se
                </a>

                <button class="entrar" type="submit">Entrar</button>
            </form>
        </section>
    </main>
    <script>
        const opcoes = document.querySelectorAll('input[name="tipo_login"]');
        const email = document.getElementById('email');
        const cpf = document.getElementById('cpf');

        function alternarLogin() {
            const usarCpf = document.getElementById('opcao-cpf').checked;

            document.getElementById('campo-email').hidden = usarCpf;
            email.disabled = usarCpf;
            email.required = !usarCpf;

            document.getElementById('campo-cpf').hidden = !usarCpf;
            cpf.disabled = !usarCpf;
            cpf.required = usarCpf;
        }

        opcoes.forEach(opcao => opcao.addEventListener('change', alternarLogin));
        window.addEventListener('pageshow', alternarLogin);
        alternarLogin();
    </script>
</body>

</html>
