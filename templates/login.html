<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="pagina-acesso">
    <a class="voltar" aria-disabled="true" title="Página inicial ainda indisponível">
        <span class="seta" aria-hidden="true">←</span>
        <span>Voltar</span>
        <span class="divisor" aria-hidden="true"></span>
        <span class="marca">Sabor &amp; Click</span>
    </a>

    <main class="login">
        <section class="cartao" aria-labelledby="titulo">
            <header class="cabecalho">
                <p class="identidade">SABOR &amp; CLICK</p>

                <h1 id="titulo">Entrar na sua conta</h1>

                <p class="descricao">
                    Acesse para organizar seu evento com sabor e praticidade.
                </p>
            </header>

            <fieldset class="opcoes-login">
                <legend>Como deseja entrar?</legend>

                <div class="alternador">
                    <input type="radio" id="opcao-email" name="tipo_login" value="email" checked>
                    <label for="opcao-email">E-mail</label>

                    <input type="radio" id="opcao-cpf" name="tipo_login" value="cpf">
                    <label for="opcao-cpf">CPF</label>
                </div>
            </fieldset>

            <form class="formulario" action="{{ url_for('auth.login') }}" method="post">
                <div class="campo">
                    <label for="credencial">
                        <span class="rotulo-email">E-mail</span>
                        <span class="rotulo-cpf">CPF</span>
                    </label>
                    <input type="text" id="credencial" name="credencial"
                        autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                        autocomplete="current-password" required>
                </div>
                <a class="cadastro" href="{{ url_for('auth.cadastro') }}">
                    Ainda não tem conta? Cadastre-se
                </a>

                <button class="entrar" type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>

</html>
