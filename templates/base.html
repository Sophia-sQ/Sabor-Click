<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-chef.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/alto_contraste.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sabor &amp; Click{% endblock %}</title>
    {% block estilos %}{% endblock %}
</head>
<body{% block atributos_body %}{% endblock %}>

    <button type="button" id="botao-alto-contraste" aria-pressed="false"> Ativar alto contraste </button>


    {% block conteudo %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/alto_contraste.js') }}" defer></script>
</body>
</html>
